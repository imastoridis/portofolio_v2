<section id="contact">
    <div class="outer-container">
        <h2 class="section-title">Contactez-moi !</h2>

        <div class="container">
            <form id="contact-form">
                <input type="hidden" name="contact_number" />
                <label for="name">Nom</label>
                <input type="text" id="name" name="user_name" placeholder="Votre nom.." />
                <label for="email">Email</label>
                <input type="email" id="email" name="user_email" placeholder="Votre email.." />
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Votre message.." style="height: 200px"></textarea>

                <input type="submit" value="Envoyer" />
                <div class="success_msg"></div>
                <div class="error_msg"></div>
            </form>
        </div>

        <div class="contact-subtitle">
            Actuellements à la recherche d'un nouvel emploi, je suis intéressé par les
            postes de :<br />
            <div class="jobs">
                <b>Développeur full-stack • Développeur front-end • Développeur
                    back-end</b>
            </div>
        </div>
    </div>
</section>
